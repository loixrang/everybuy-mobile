name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build, sign and publish APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Ensure release tag is reachable from the default branch
        env:
          TAG: ${{ github.event.release.tag_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ -z "$DEFAULT_BRANCH" ]]; then
            echo "::error::GitHub did not provide the repository default branch."
            exit 1
          fi
          git fetch --no-tags origin "refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/release-default-branch"
          TAG_SHA="$(git rev-parse --verify --end-of-options "${TAG}^{commit}")"
          DEFAULT_BRANCH_SHA="$(git rev-parse --verify refs/remotes/origin/release-default-branch)"
          echo "Tag $TAG → $TAG_SHA"
          echo "origin/${DEFAULT_BRANCH} → $DEFAULT_BRANCH_SHA"
          if ! git merge-base --is-ancestor "$TAG_SHA" refs/remotes/origin/release-default-branch; then
            echo "::error::Release tag commit is not reachable from the repository default branch '${DEFAULT_BRANCH}'. Refusing to build."
            echo "Merge the tagged commit into '${DEFAULT_BRANCH}' before publishing the release."
            exit 1
          fi
          echo "Tag is reachable from the repository default branch."

      - name: Require Android signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [[ -z "${ANDROID_KEYSTORE_BASE64}" ]] && missing+=("ANDROID_KEYSTORE_BASE64")
          [[ -z "${ANDROID_KEYSTORE_PASSWORD}" ]] && missing+=("ANDROID_KEYSTORE_PASSWORD")
          [[ -z "${ANDROID_KEY_ALIAS}" ]] && missing+=("ANDROID_KEY_ALIAS")
          [[ -z "${ANDROID_KEY_PASSWORD}" ]] && missing+=("ANDROID_KEY_PASSWORD")
          if ((${#missing[@]} > 0)); then
            echo "::error::Missing required repository secrets: ${missing[*]}"
            echo "Configure these under Settings → Secrets and variables → Actions before publishing a release."
            echo "See README.md → Publishing releases for setup steps. An unsigned APK will not be published."
            exit 1
          fi

      - name: Derive Android version from tag
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          chmod +x .github/scripts/version-from-tag.sh
          VERSION_OUTPUT="$(.github/scripts/version-from-tag.sh "$TAG")"
          VERSION_NAME="$(sed -n 's/^VERSION_NAME=//p' <<< "$VERSION_OUTPUT")"
          VERSION_CODE="$(sed -n 's/^VERSION_CODE=//p' <<< "$VERSION_OUTPUT")"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Using versionName=$VERSION_NAME versionCode=$VERSION_CODE"

      - name: Ensure versionCode increases
        id: releases
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
          VERSION_CODE: ${{ steps.version.outputs.VERSION_CODE }}
        run: |
          set -euo pipefail
          RELEASE_TAGS="$(gh api --paginate "repos/${REPOSITORY}/releases?per_page=100" \
            --jq '.[] | select(.draft == false) | .tag_name')" || {
            echo "::error::Unable to read published GitHub releases to validate versionCode."
            exit 1
          }
          PREVIOUS_RELEASE_TAG=""
          PREVIOUS_RELEASE_CODE=0
          declare -A PUBLISHED_TAGS_BY_CODE=()
          while IFS= read -r previous_tag; do
            [[ -z "$previous_tag" || "$previous_tag" == "$TAG" ]] && continue
            if ! previous_version="$(.github/scripts/version-from-tag.sh "$previous_tag" 2>/dev/null)"; then
              echo "::error::Existing published release '$previous_tag' does not use a supported stable version tag."
              exit 1
            fi
            previous_code="$(sed -n 's/^VERSION_CODE=//p' <<< "$previous_version")"
            if [[ -n "${PUBLISHED_TAGS_BY_CODE[$previous_code]:-}" ]]; then
              echo "::error::Published releases '${PUBLISHED_TAGS_BY_CODE[$previous_code]}' and '$previous_tag' share versionCode $previous_code."
              exit 1
            fi
            PUBLISHED_TAGS_BY_CODE["$previous_code"]="$previous_tag"
            if (( VERSION_CODE <= previous_code )); then
              echo "::error::versionCode $VERSION_CODE must be greater than published release '$previous_tag' (versionCode $previous_code)."
              exit 1
            fi
            if (( previous_code > PREVIOUS_RELEASE_CODE )); then
              PREVIOUS_RELEASE_CODE="$previous_code"
              PREVIOUS_RELEASE_TAG="$previous_tag"
            fi
          done <<< "$RELEASE_TAGS"
          echo "previous_tag=$PREVIOUS_RELEASE_TAG" >> "$GITHUB_OUTPUT"
          if [[ -n "$PREVIOUS_RELEASE_TAG" ]]; then
            echo "versionCode $VERSION_CODE is greater than every published stable release; most recent version is $PREVIOUS_RELEASE_TAG ($PREVIOUS_RELEASE_CODE)."
          else
            echo "No previous published stable releases; this is the first release."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: List available platforms
        run: sdkmanager --list | grep -E "platforms;android-3[6-9]"

      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
        with:
          cache-read-only: false
          validate-wrappers: true

      - name: Test debug API config used by both variants
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Decode and verify the release keystore
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="${RUNNER_TEMP}/everybuy-release.jks"
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          if [[ ! -s "$KEYSTORE_PATH" ]]; then
            echo "::error::Decoded keystore is empty. Check ANDROID_KEYSTORE_BASE64."
            exit 1
          fi
          chmod 600 "$KEYSTORE_PATH"
          CERT_SHA256="$(keytool -exportcert \
            -alias "$ANDROID_KEY_ALIAS" \
            -keystore "$KEYSTORE_PATH" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD | sha256sum | awk '{print tolower($1)}')"
          if [[ ! "$CERT_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Could not determine the release certificate fingerprint. Check the keystore password and alias."
            exit 1
          fi
          echo "cert_sha256=$CERT_SHA256" >> "$GITHUB_OUTPUT"

      - name: Build signed release APKs with shared production API config
        env:
          EVERYBUY_STORE_FILE: ${{ runner.temp }}/everybuy-release.jks
          EVERYBUY_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          EVERYBUY_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          EVERYBUY_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.VERSION_NAME }}
          VERSION_CODE: ${{ steps.version.outputs.VERSION_CODE }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace :app:assembleRelease \
            "-Peverybuy.versionName=${VERSION_NAME}" \
            "-Peverybuy.versionCode=${VERSION_CODE}"

      - name: Collect and validate APKs
        id: apks
        env:
          TAG: ${{ github.event.release.tag_name }}
          VERSION_NAME: ${{ steps.version.outputs.VERSION_NAME }}
          VERSION_CODE: ${{ steps.version.outputs.VERSION_CODE }}
          EXPECTED_CERT_SHA256: ${{ steps.keystore.outputs.cert_sha256 }}
        run: |
          set -euo pipefail
          DIST="${RUNNER_TEMP}/dist"
          rm -rf "$DIST"
          mkdir -p "$DIST"
          python3 .github/scripts/collect-release-apks.py \
            "$TAG" "$VERSION_NAME" "$VERSION_CODE" "$DIST"
          mapfile -t APKS < <(find "$DIST" -maxdepth 1 -type f -name '*.apk' -print | sort)
          if ((${#APKS[@]} == 0)); then
            echo "::error::No validated release APKs were collected."
            exit 1
          fi

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          APKSIGNER="${SDK_ROOT}/build-tools/36.0.0/apksigner"
          if [[ -z "$SDK_ROOT" || ! -x "$APKSIGNER" ]]; then
            echo "::error::Android apksigner was not found; cannot verify release APK signatures."
            exit 1
          fi
          for apk in "${APKS[@]}"; do
            VERIFY_OUTPUT="$("$APKSIGNER" verify --print-certs "$apk")"
            mapfile -t SIGNER_CERTS < <(
              awk -F': ' '/^Signer #[0-9]+ certificate SHA-256 digest:/ {print tolower($2)}' <<< "$VERIFY_OUTPUT"
            )
            if ((${#SIGNER_CERTS[@]} != 1)) || [[ "${SIGNER_CERTS[0]:-}" != "$EXPECTED_CERT_SHA256" ]]; then
              echo "::error::APK signature does not match the configured release keystore: $(basename "$apk")"
              exit 1
            fi
            echo "Verified release signature: $(basename "$apk")"
          done

          echo "dir=$DIST" >> "$GITHUB_OUTPUT"
          printf 'Verified %s release APK(s)\n' "${#APKS[@]}"

      - name: Build release changelog asset
        id: changelog
        env:
          TAG: ${{ github.event.release.tag_name }}
          VERSION_NAME: ${{ steps.version.outputs.VERSION_NAME }}
          PREVIOUS_RELEASE_TAG: ${{ steps.releases.outputs.previous_tag }}
          PUBLISHED_AT: ${{ github.event.release.published_at }}
          DIST_DIR: ${{ steps.apks.outputs.dir }}
        run: |
          set -euo pipefail
          OUT="${DIST_DIR}/CHANGELOG-${TAG}.md"
          .github/scripts/extract-changelog.sh \
            "$VERSION_NAME" "$TAG" "$OUT" CHANGELOG.md "$PREVIOUS_RELEASE_TAG" "$PUBLISHED_AT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload assets and update release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          CHANGELOG_PATH: ${{ steps.changelog.outputs.path }}
          DIST_DIR: ${{ steps.apks.outputs.dir }}
        run: |
          set -euo pipefail
          if [[ -z "$CHANGELOG_PATH" || ! -s "$CHANGELOG_PATH" ]]; then
            echo "::error::Release changelog is missing or empty; refusing to upload release assets."
            exit 1
          fi
          mapfile -t FILES < <(find "$DIST_DIR" -maxdepth 1 -type f \( -name '*.apk' -o -name 'CHANGELOG-*.md' \) | sort)
          if ((${#FILES[@]} == 0)); then
            echo "::error::No assets to upload."
            exit 1
          fi
          gh release upload "$TAG" "${FILES[@]}" --clobber
          gh release edit "$TAG" --notes-file "$CHANGELOG_PATH"
          echo "Uploaded:"
          printf ' - %s\n' "${FILES[@]}"

      - name: Clean up keystore
        if: always()
        run: |
          set -euo pipefail
          KEYSTORE_PATH="${RUNNER_TEMP}/everybuy-release.jks"
          if [[ -f "$KEYSTORE_PATH" ]]; then
            shred -u "$KEYSTORE_PATH" 2>/dev/null || rm -f "$KEYSTORE_PATH"
          fi
          rm -rf "${RUNNER_TEMP}/dist" 2>/dev/null || true
