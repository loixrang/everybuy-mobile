name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build, sign and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Ensure release tag is reachable from master
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin master:refs/remotes/origin/master
          TAG_SHA="$(git rev-list -n 1 "$TAG")"
          MASTER_SHA="$(git rev-parse origin/master)"
          echo "Tag $TAG → $TAG_SHA"
          echo "origin/master → $MASTER_SHA"
          if ! git merge-base --is-ancestor "$TAG_SHA" origin/master; then
            echo "::error::Release tag commit is not reachable from origin/master. Refusing to build."
            echo "Publish releases only from commits that are on master (merge first if needed)."
            exit 1
          fi
          echo "Tag is an ancestor of origin/master."

      - name: Require Android signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [[ -z "${ANDROID_KEYSTORE_BASE64}" ]] && missing+=("ANDROID_KEYSTORE_BASE64")
          [[ -z "${ANDROID_KEYSTORE_PASSWORD}" ]] && missing+=("ANDROID_KEYSTORE_PASSWORD")
          [[ -z "${ANDROID_KEY_ALIAS}" ]] && missing+=("ANDROID_KEY_ALIAS")
          [[ -z "${ANDROID_KEY_PASSWORD}" ]] && missing+=("ANDROID_KEY_PASSWORD")
          if ((${#missing[@]} > 0)); then
            echo "::error::Missing required repository secrets: ${missing[*]}"
            echo "Configure these under Settings → Secrets and variables → Actions before publishing a release."
            echo "See README.md → Publishing releases for setup steps. An unsigned APK will not be published."
            exit 1
          fi

      - name: Derive Android version from tag
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          chmod +x .github/scripts/version-from-tag.sh
          VERSION_OUTPUT="$(.github/scripts/version-from-tag.sh "$TAG")"
          VERSION_NAME="$(sed -n 's/^VERSION_NAME=//p' <<< "$VERSION_OUTPUT")"
          VERSION_CODE="$(sed -n 's/^VERSION_CODE=//p' <<< "$VERSION_OUTPUT")"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Using versionName=$VERSION_NAME versionCode=$VERSION_CODE"

      - name: Ensure versionCode increases
        id: releases
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          VERSION_CODE: ${{ steps.version.outputs.VERSION_CODE }}
        run: |
          set -euo pipefail
          RELEASE_TAGS="$(gh release list --limit 1000 --json tagName --jq '.[].tagName')" || {
            echo "::error::Unable to read published GitHub releases to validate versionCode."
            exit 1
          }
          PREVIOUS_RELEASE_TAG=""
          while IFS= read -r previous_tag; do
            [[ -z "$previous_tag" || "$previous_tag" == "$TAG" ]] && continue
            if [[ -z "$PREVIOUS_RELEASE_TAG" ]]; then
              PREVIOUS_RELEASE_TAG="$previous_tag"
            fi
            if ! previous_version="$(.github/scripts/version-from-tag.sh "$previous_tag" 2>/dev/null)"; then
              echo "::error::Existing published release '$previous_tag' does not use a supported stable version tag."
              exit 1
            fi
            previous_code="$(sed -n 's/^VERSION_CODE=//p' <<< "$previous_version")"
            if (( VERSION_CODE <= previous_code )); then
              echo "::error::versionCode $VERSION_CODE must be greater than published release '$previous_tag' (versionCode $previous_code)."
              exit 1
            fi
          done <<< "$RELEASE_TAGS"
          echo "previous_tag=$PREVIOUS_RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "versionCode $VERSION_CODE is greater than all previous published releases."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: |
            platform-tools
            platforms;android-37

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          validate-wrappers: true

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="${RUNNER_TEMP}/everybuy-release.jks"
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          if [[ ! -s "$KEYSTORE_PATH" ]]; then
            echo "::error::Decoded keystore is empty. Check ANDROID_KEYSTORE_BASE64."
            exit 1
          fi
          chmod 600 "$KEYSTORE_PATH"

      - name: Run unit tests
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Build signed release APKs
        env:
          EVERYBUY_STORE_FILE: ${{ runner.temp }}/everybuy-release.jks
          EVERYBUY_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          EVERYBUY_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          EVERYBUY_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace :app:assembleRelease \
            -Peverybuy.versionName="${{ steps.version.outputs.VERSION_NAME }}" \
            -Peverybuy.versionCode="${{ steps.version.outputs.VERSION_CODE }}"

      - name: Collect and validate APKs
        id: apks
        env:
          TAG: ${{ github.event.release.tag_name }}
          VERSION_NAME: ${{ steps.version.outputs.VERSION_NAME }}
        run: |
          set -euo pipefail
          DIST="${RUNNER_TEMP}/dist"
          mkdir -p "$DIST"
          mapfile -t APKS < <(find app/build/outputs/apk/release -type f -name '*.apk' | sort)
          if ((${#APKS[@]} == 0)); then
            echo "::error::No release APKs were produced."
            exit 1
          fi

          UNIVERSAL=""
          ASSET_LIST=()
          for apk in "${APKS[@]}"; do
            size="$(stat -c%s "$apk")"
            if (( size < 1000 )); then
              echo "::error::APK is empty or too small: $apk ($size bytes)"
              exit 1
            fi
            base="$(basename "$apk")"
            # Expected patterns: app-universal-release.apk, app-arm64-v8a-release.apk, ...
            if [[ "$base" == *universal* ]]; then
              dest="$DIST/everybuy-${TAG}-universal.apk"
              UNIVERSAL="$dest"
            elif [[ "$base" =~ app-(armeabi-v7a|arm64-v8a|x86_64|x86)-release\.apk ]]; then
              abi="${BASH_REMATCH[1]}"
              dest="$DIST/everybuy-${TAG}-${abi}.apk"
            else
              dest="$DIST/everybuy-${TAG}-${base}"
            fi
            cp -f "$apk" "$dest"
            ASSET_LIST+=("$dest")
            echo "Prepared $dest ($size bytes)"
          done

          if [[ -z "$UNIVERSAL" || ! -s "$UNIVERSAL" ]]; then
            echo "::error::Universal release APK was not found. Refusing to publish."
            printf '%s\n' "${APKS[@]}"
            exit 1
          fi

          APKSIGNER="$(command -v apksigner || true)"
          if [[ -z "$APKSIGNER" ]]; then
            SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
            if [[ -n "$SDK_ROOT" && -d "$SDK_ROOT/build-tools" ]]; then
              APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner -print | sort -V | tail -n1)"
            fi
          fi
          if [[ -z "$APKSIGNER" || ! -x "$APKSIGNER" ]]; then
            echo "::error::Android apksigner was not found; cannot verify release APK signatures."
            exit 1
          fi
          for apk in "${APKS[@]}"; do
            "$APKSIGNER" verify --print-certs "$apk"
          done

          {
            echo "universal=$UNIVERSAL"
            echo "dir=$DIST"
          } >> "$GITHUB_OUTPUT"
          printf 'Prepared %s APK asset(s)\n' "${#ASSET_LIST[@]}"

      - name: Build release changelog asset
        id: changelog
        env:
          TAG: ${{ github.event.release.tag_name }}
          VERSION_NAME: ${{ steps.version.outputs.VERSION_NAME }}
          PREVIOUS_RELEASE_TAG: ${{ steps.releases.outputs.previous_tag }}
          DIST_DIR: ${{ steps.apks.outputs.dir }}
        run: |
          set -euo pipefail
          chmod +x .github/scripts/extract-changelog.sh
          OUT="${DIST_DIR}/CHANGELOG-${TAG}.md"
          .github/scripts/extract-changelog.sh "$VERSION_NAME" "$TAG" "$OUT" CHANGELOG.md "$PREVIOUS_RELEASE_TAG"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload assets and update release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          CHANGELOG_PATH: ${{ steps.changelog.outputs.path }}
          DIST_DIR: ${{ steps.apks.outputs.dir }}
        run: |
          set -euo pipefail
          mapfile -t FILES < <(find "$DIST_DIR" -maxdepth 1 -type f \( -name '*.apk' -o -name 'CHANGELOG-*.md' \) | sort)
          if ((${#FILES[@]} == 0)); then
            echo "::error::No assets to upload."
            exit 1
          fi
          gh release upload "$TAG" "${FILES[@]}" --clobber
          gh release edit "$TAG" --notes-file "$CHANGELOG_PATH"
          echo "Uploaded:"
          printf ' - %s\n' "${FILES[@]}"

      - name: Clean up keystore
        if: always()
        run: |
          set -euo pipefail
          KEYSTORE_PATH="${RUNNER_TEMP}/everybuy-release.jks"
          if [[ -f "$KEYSTORE_PATH" ]]; then
            shred -u "$KEYSTORE_PATH" 2>/dev/null || rm -f "$KEYSTORE_PATH"
          fi
          rm -rf "${RUNNER_TEMP}/dist" 2>/dev/null || true
